name: Release

# 打 v* 标签时构建并发布 APK。
# 本项目没有 release signingConfig，因此：
#   - app-release-unsigned.apk：R8 优化后的正式产物，需使用者自行签名后安装
#   - app-debug.apk：debug 签名，可直接安装体验
# 全程无需任何 Secrets。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build release (unsigned) and debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ || \
            cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Narvive ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 安装说明 / Installation

            - `app-release-unsigned.apk` —— 正式产物（R8 优化、未签名）。
              需自行签名后安装，例如：
              ```
              apksigner sign --ks your.jks --out Narvive-signed.apk app-release-unsigned.apk
              ```
            - `app-debug.apk` —— 使用 debug 密钥签名，可直接安装用于体验与测试。

            要求 Android 8.0（API 26）及以上。
          files: |
            dist/*.apk
