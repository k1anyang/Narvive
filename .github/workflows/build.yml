name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只读权限即可：本工作流只做编译与单测，不发布任何产物到 Release
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须用 JDK 21：gradle/gradle-daemon-jvm.properties 固定了 toolchainVersion=21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties 不入库（见 .gitignore），CI 上按 runner 的 SDK 路径生成
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # tee + set -o pipefail：完整 Gradle 输出同时进日志文件和 artifact，
      # 失败时不必只靠 UI 里被截断的行；pipefail 保证 gradlew 的非零退出码不会被 tee 吞掉。
      # --stacktrace：网络类失败要靠堆栈才能定位到具体是哪个仓库/URL。
      - name: Compile
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --console=plain --stacktrace 2>&1 | tee gradle.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee -a gradle.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
